<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Tech Glow -->
    <radialGradient id="lfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Frame Gradients (Chiseled 3D Architecture) -->
    <linearGradient id="metalArmTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="metalArmTR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="metalArmBL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="metalArmBR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Bevel Facet Shading Gradients -->
    <linearGradient id="bevelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bevelBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan Conduit Gradients (Left Flow) -->
    <linearGradient id="cyanConduit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="cyanConduit2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <!-- Orange Conduit Gradients (Right Flow) -->
    <linearGradient id="orangeConduit1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="orangeConduit2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Port Well Radial Gradient -->
    <radialGradient id="portWell" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="portDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#lfGlow)" />

  <!-- ================= 3D ARCHITECTURAL 'X' FRAME ================= -->
  <!-- Outer Chiseled Metallic Silhouette -->
  <!-- Corner tips: (50, 50), (450, 50), (450, 450), (50, 450) -->
  <path d="M 50 50 
           L 125 50 
           C 175 110, 215 135, 250 135 
           C 285 135, 325 110, 375 50 
           L 450 50 
           L 450 125 
           C 390 175, 365 215, 365 250 
           C 365 285, 390 325, 450 375 
           L 450 450 
           L 375 450 
           C 325 390, 285 365, 250 365 
           C 215 365, 175 390, 125 450 
           L 50 450 
           L 50 375 
           C 110 325, 135 285, 135 250 
           C 135 215, 110 175, 50 125 
           Z" 
        fill="#090d16" 
        stroke="#1e293b" 
        stroke-width="2" />

  <!-- 4 Corner Metallic Structural Facets (Giving 3D Depth to the 4 Arms) -->
  <!-- Top-Left Arm Facet -->
  <polygon points="50,50 125,50 165,115 115,165 50,125" fill="url(#metalArmTL)" />
  <polygon points="50,50 125,50 110,75 75,75 50,125" fill="url(#bevelTop)" opacity="0.8" />

  <!-- Top-Right Arm Facet -->
  <polygon points="450,50 375,50 335,115 385,165 450,125" fill="url(#metalArmTR)" />
  <polygon points="450,50 375,50 390,75 425,75 450,125" fill="url(#bevelTop)" opacity="0.8" />

  <!-- Bottom-Left Arm Facet -->
  <polygon points="50,450 125,450 165,385 115,335 50,375" fill="url(#metalArmBL)" />
  <polygon points="50,450 125,450 110,425 75,425 50,375" fill="url(#bevelBottom)" opacity="0.8" />

  <!-- Bottom-Right Arm Facet -->
  <polygon points="450,450 375,450 335,385 385,335 450,375" fill="url(#metalArmBR)" />
  <polygon points="450,450 375,450 390,425 425,425 450,375" fill="url(#bevelBottom)" opacity="0.8" />

  <!-- Architectural Contour Grooves / Cooling Fins -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.6" stroke-linecap="round">
    <!-- Top cavity fins -->
    <path d="M 210 110 C 230 130, 270 130, 290 110" fill="none" />
    <path d="M 225 90 C 240 105, 260 105, 275 90" fill="none" />
    <!-- Bottom cavity fins -->
    <path d="M 210 390 C 230 370, 270 370, 290 390" fill="none" />
    <path d="M 225 410 C 240 395, 260 395, 275 410" fill="none" />
    <!-- Left cavity fins -->
    <path d="M 110 210 C 130 230, 130 270, 110 290" fill="none" />
    <!-- Right cavity fins -->
    <path d="M 390 210 C 370 230, 370 270, 390 290" fill="none" />
  </g>

  <!-- ================= GLOWING CONDUITS (DATA / SUPPLY FLOW) ================= -->
  
  <!-- LEFT SIDE: CYAN STREAM CONDUITS (Upper & Lower Streams) -->
  <g filter="url(#cyanGlow)">
    <!-- Base Outer Conduit Glow Ribbons -->
    <!-- Top-Left Stream 1 -> Top Port -->
    <path d="M 115 165 C 160 185, 210 190, 245 208" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <!-- Top-Left Stream 2 -> Left Port -->
    <path d="M 140 140 C 170 180, 185 220, 208 245" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    
    <!-- Bottom-Left Stream 1 -> Left Port -->
    <path d="M 140 360 C 170 320, 185 280, 208 255" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <!-- Bottom-Left Stream 2 -> Bottom Port -->
    <path d="M 115 335 C 160 315, 210 310, 245 292" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" opacity="0.85" />

    <!-- Core Bright Conduit Lines -->
    <path d="M 115 165 C 160 185, 210 190, 245 208" fill="none" stroke="url(#cyanConduit1)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 140 140 C 170 180, 185 220, 208 245" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 140 360 C 170 320, 185 280, 208 255" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 115 335 C 160 315, 210 310, 245 292" fill="none" stroke="url(#cyanConduit2)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- RIGHT SIDE: FIERY ORANGE STREAM CONDUITS (Upper & Lower Streams) -->
  <g filter="url(#orangeGlow)">
    <!-- Base Outer Conduit Glow Ribbons -->
    <!-- Top-Right Stream 1 -> Top Port -->
    <path d="M 385 165 C 340 185, 290 190, 255 208" fill="none" stroke="#ff6b35" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <!-- Top-Right Stream 2 -> Right Port -->
    <path d="M 360 140 C 330 180, 315 220, 292 245" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom-Right Stream 1 -> Right Port -->
    <path d="M 360 360 C 330 320, 315 280, 292 255" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <!-- Bottom-Right Stream 2 -> Bottom Port -->
    <path d="M 385 335 C 340 315, 290 310, 255 292" fill="none" stroke="#ff6b35" stroke-width="9" stroke-linecap="round" opacity="0.85" />

    <!-- Core Bright Conduit Lines -->
    <path d="M 385 165 C 340 185, 290 190, 255 208" fill="none" stroke="url(#orangeConduit1)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 360 140 C 330 180, 315 220, 292 245" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <path d="M 360 360 C 330 320, 315 280, 292 255" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <path d="M 385 335 C 340 315, 290 310, 255 292" fill="none" stroke="url(#orangeConduit2)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- ================= 4 CENTRAL CIRCULAR PORTS (SOCKET MATRIX) ================= -->
  <!-- Top Port -->
  <g transform="translate(250, 206)" filter="url(#portDrop)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#334155" stroke-width="2.5" />
    <circle cx="0" cy="0" r="17" fill="url(#portWell)" />
    <!-- Cyan & Orange Connector Terminals -->
    <circle cx="-5" cy="0" r="4" fill="#00e5ff" opacity="0.9" />
    <circle cx="5" cy="0" r="4" fill="#ff6b35" opacity="0.9" />
  </g>

  <!-- Bottom Port -->
  <g transform="translate(250, 294)" filter="url(#portDrop)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#334155" stroke-width="2.5" />
    <circle cx="0" cy="0" r="17" fill="url(#portWell)" />
    <circle cx="-5" cy="0" r="4" fill="#00e5ff" opacity="0.9" />
    <circle cx="5" cy="0" r="4" fill="#ff6b35" opacity="0.9" />
  </g>

  <!-- Left Port -->
  <g transform="translate(206, 250)" filter="url(#portDrop)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#334155" stroke-width="2.5" />
    <circle cx="0" cy="0" r="17" fill="url(#portWell)" />
    <circle cx="0" cy="-5" r="4" fill="#00e5ff" opacity="0.9" />
    <circle cx="0" cy="5" r="4" fill="#00e5ff" opacity="0.9" />
  </g>

  <!-- Right Port -->
  <g transform="translate(294, 250)" filter="url(#portDrop)">
    <circle cx="0" cy="0" r="23" fill="#090d16" stroke="#334155" stroke-width="2.5" />
    <circle cx="0" cy="0" r="17" fill="url(#portWell)" />
    <circle cx="0" cy="-5" r="4" fill="#ff6b35" opacity="0.9" />
    <circle cx="0" cy="5" r="4" fill="#ff6b35" opacity="0.9" />
  </g>

  <!-- Central Void Opening Highlight (Small diamond reflection between 4 ports) -->
  <polygon points="250,244 256,250 250,256 244,250" fill="#ffffff" opacity="0.6" />
</svg>