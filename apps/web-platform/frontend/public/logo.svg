<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Tech Radial Glow -->
    <radialGradient id="lfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Frame Gradients (3D Architectural Gunmetal) -->
    <linearGradient id="metalTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="metalTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="metalBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="metalBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Outer Bevel Edge Highlight Gradients -->
    <linearGradient id="rimTopHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Cyan Stream Conduit Gradients (Left Side) -->
    <linearGradient id="cyanTubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#00e5ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="cyanCoreLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Orange/Fire Stream Conduit Gradients (Right Side) -->
    <linearGradient id="orangeTubeGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="orangeCoreLight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Port Well Radial Gradient -->
    <radialGradient id="portSocket" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Precision Glow Filters -->
    <filter id="cyanFlowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orangeFlowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="225" fill="url(#lfGlow)" />

  <!-- ================= 3D ARCHITECTURAL 'X' FRAME ================= -->
  <g filter="url(#frameShadow)">
    <!-- Base Solid Frame Silhouette with Deep Concave Scoops -->
    <path d="M 52 50 
             L 126 50 
             C 175 110, 215 130, 250 130 
             C 285 130, 325 110, 374 50 
             L 448 50 
             L 448 124 
             C 390 175, 370 215, 370 250 
             C 370 285, 390 325, 448 376 
             L 448 450 
             L 374 450 
             C 325 390, 285 370, 250 370 
             C 215 370, 175 390, 126 450 
             L 52 450 
             L 52 376 
             C 110 325, 130 285, 130 250 
             C 130 215, 110 175, 52 124 
             Z" 
          fill="#090d16" 
          stroke="#1e293b" 
          stroke-width="2" />

    <!-- 4 Corner Sculpted 3D Metallic Facets -->
    <!-- Top-Left Arm Facet -->
    <polygon points="52,50 126,50 168,118 118,168 52,124" fill="url(#metalTopLeft)" />
    <path d="M 52 50 L 126 50 L 105 76 L 72 76 L 52 124 Z" fill="#64748b" opacity="0.6" />

    <!-- Top-Right Arm Facet -->
    <polygon points="448,50 374,50 332,118 382,168 448,124" fill="url(#metalTopRight)" />
    <path d="M 448 50 L 374 50 L 395 76 L 428 76 L 448 124 Z" fill="#64748b" opacity="0.6" />

    <!-- Bottom-Left Arm Facet -->
    <polygon points="52,450 126,450 168,382 118,332 52,376" fill="url(#metalBottomLeft)" />
    <path d="M 52 450 L 126 450 L 105 424 L 72 424 L 52 376 Z" fill="#334155" opacity="0.6" />

    <!-- Bottom-Right Arm Facet -->
    <polygon points="448,450 374,450 332,382 382,332 448,376" fill="url(#metalBottomRight)" />
    <path d="M 448 450 L 374 450 L 395 424 L 428 424 L 448 376 Z" fill="#334155" opacity="0.6" />

    <!-- Fine Radiating Architectural Grooves / Heat Dissipation Ribs -->
    <g stroke="#334155" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
      <!-- Top Scoop Grooves -->
      <path d="M 205 105 C 225 125, 275 125, 295 105" fill="none" />
      <path d="M 220 85 C 235 100, 265 100, 280 85" fill="none" />
      <!-- Bottom Scoop Grooves -->
      <path d="M 205 395 C 225 375, 275 375, 295 395" fill="none" />
      <path d="M 220 415 C 235 400, 265 400, 280 415" fill="none" />
      <!-- Left Scoop Grooves -->
      <path d="M 105 205 C 125 225, 125 275, 105 295" fill="none" />
      <!-- Right Scoop Grooves -->
      <path d="M 395 205 C 375 225, 375 275, 395 295" fill="none" />
    </g>

    <!-- Outer Edge Specular Bevel Highlights -->
    <path d="M 52 50 L 126 50 M 374 50 L 448 50" stroke="url(#rimTopHighlight)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= GLOWING CONDUIT BUNDLES (FLOW PIPELINES) ================= -->
  
  <!-- LEFT SIDE: ELECTRIC CYAN FLOW BUNDLE -->
  <g filter="url(#cyanFlowGlow)">
    <!-- Deep Ambient Glow Base -->
    <path d="M 118 168 C 160 195, 205 202, 244 216" fill="none" stroke="#00e5ff" stroke-width="11" stroke-linecap="round" opacity="0.8" />
    <path d="M 145 142 C 175 185, 195 215, 216 244" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 145 358 C 175 315, 195 285, 216 256" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 118 332 C 160 305, 205 298, 244 284" fill="none" stroke="#00e5ff" stroke-width="11" stroke-linecap="round" opacity="0.8" />

    <!-- Primary Illuminated Conduit Tubes -->
    <path d="M 118 168 C 160 195, 205 202, 244 216" fill="none" stroke="url(#cyanTubeGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 145 142 C 175 185, 195 215, 216 244" fill="none" stroke="url(#cyanTubeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 145 358 C 175 315, 195 285, 216 256" fill="none" stroke="url(#cyanTubeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 118 332 C 160 305, 205 298, 244 284" fill="none" stroke="url(#cyanTubeGrad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Specular Highlight Threads (Core Glass Sheen) -->
    <path d="M 118 168 C 160 195, 205 202, 244 216" fill="none" stroke="url(#cyanCoreLight)" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 142 C 175 185, 195 215, 216 244" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 145 358 C 175 315, 195 285, 216 256" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 118 332 C 160 305, 205 298, 244 284" fill="none" stroke="url(#cyanCoreLight)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- RIGHT SIDE: FIERY ORANGE FLOW BUNDLE -->
  <g filter="url(#orangeFlowGlow)">
    <!-- Deep Ambient Glow Base -->
    <path d="M 382 168 C 340 195, 295 202, 256 216" fill="none" stroke="#ff6b35" stroke-width="11" stroke-linecap="round" opacity="0.8" />
    <path d="M 355 142 C 325 185, 305 215, 284 244" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 355 358 C 325 315, 305 285, 284 256" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 382 332 C 340 305, 295 298, 256 284" fill="none" stroke="#ff6b35" stroke-width="11" stroke-linecap="round" opacity="0.8" />

    <!-- Primary Illuminated Conduit Tubes -->
    <path d="M 382 168 C 340 195, 295 202, 256 216" fill="none" stroke="url(#orangeTubeGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 355 142 C 325 185, 305 215, 284 244" fill="none" stroke="url(#orangeTubeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 355 358 C 325 315, 305 285, 284 256" fill="none" stroke="url(#orangeTubeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 382 332 C 340 305, 295 298, 256 284" fill="none" stroke="url(#orangeTubeGrad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Specular Highlight Threads (Core Ember Sheen) -->
    <path d="M 382 168 C 340 195, 295 202, 256 216" fill="none" stroke="url(#orangeCoreLight)" stroke-width="2" stroke-linecap="round" />
    <path d="M 355 142 C 325 185, 305 215, 284 244" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 355 358 C 325 315, 305 285, 284 256" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 382 332 C 340 305, 295 298, 256 284" fill="none" stroke="url(#orangeCoreLight)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= 4 CENTRAL PORTS (TIGHT CLUSTER MATRIX MATCHING ORIGINAL) ================= -->
  <!-- Top Port: Center (250, 218) -->
  <g transform="translate(250, 218)">
    <circle cx="0" cy="0" r="21" fill="#090d16" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="url(#portSocket)" />
    <!-- Optical Lens Reflection -->
    <circle cx="-4" cy="-4" r="3" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Bottom Port: Center (250, 282) -->
  <g transform="translate(250, 282)">
    <circle cx="0" cy="0" r="21" fill="#090d16" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="url(#portSocket)" />
    <circle cx="-4" cy="-4" r="3" fill="#ea580c" opacity="0.6" />
  </g>

  <!-- Left Port: Center (218, 250) -->
  <g transform="translate(218, 250)">
    <circle cx="0" cy="0" r="21" fill="#090d16" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="url(#portSocket)" />
    <circle cx="-4" cy="-4" r="3" fill="#00e5ff" opacity="0.7" />
  </g>

  <!-- Right Port: Center (282, 250) -->
  <g transform="translate(282, 250)">
    <circle cx="0" cy="0" r="21" fill="#090d16" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="url(#portSocket)" />
    <circle cx="-4" cy="-4" r="3" fill="#ff6b35" opacity="0.7" />
  </g>

  <!-- Central Cross Aperture Void (Exact Center Opening) -->
  <circle cx="250" cy="250" r="5" fill="#ffffff" opacity="0.9" filter="url(#cyanFlowGlow)" />
</svg>
