<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lfBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="48%" stop-color="#0284c7" />
      <stop offset="52%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <filter id="lfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Tile -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#08101e" stroke="url(#lfBorderGrad)" stroke-width="3.5" />

  <!-- Inner Ambient Glow Fill -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="rgba(0, 229, 255, 0.04)" />

  <!-- X-Nexus Geometry -->
  <g filter="url(#lfGlow)">
    <!-- Left Conduits (Electric Cyan) -->
    <path d="M 26 28 Q 42 42, 50 50" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 26 72 Q 42 58, 50 50" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 25 50 Q 38 50, 48 50" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />

    <!-- Right Conduits (Fiery Orange) -->
    <path d="M 74 28 Q 58 42, 50 50" fill="none" stroke="#ff5500" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 74 72 Q 58 58, 50 50" fill="none" stroke="#ff5500" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 75 50 Q 62 50, 52 50" fill="none" stroke="#ff5500" stroke-width="3" stroke-linecap="round" />

    <!-- Left & Right Inflow Nodes -->
    <circle cx="26" cy="28" r="4" fill="#00e5ff" />
    <circle cx="26" cy="72" r="4" fill="#00e5ff" />
    <circle cx="74" cy="28" r="4" fill="#ff5500" />
    <circle cx="74" cy="72" r="4" fill="#ff5500" />

    <!-- Central Nexus Hub -->
    <circle cx="50" cy="50" r="5.5" fill="#0b172a" stroke="#ffffff" stroke-width="2" />
    <circle cx="50" cy="50" r="2.5" fill="#00e5ff" />
  </g>
</svg>