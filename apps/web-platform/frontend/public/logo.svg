<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Border Gradient: Cyan to Orange -->
    <linearGradient id="lfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="48%" stop-color="#0284c7" />
      <stop offset="52%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <!-- Subtle Cyan Ambient Fill -->
    <linearGradient id="lfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b29" />
      <stop offset="50%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#1c0e08" />
    </linearGradient>

    <filter id="lfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container Tile -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#lfBg)" stroke="url(#lfBorder)" stroke-width="3" />

  <!-- Monoline X-Flow Nexus Glyph (Stroke Width 4.8, perfectly centered) -->
  <g filter="url(#lfGlow)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Inflow Streams (Electric Cyan) -->
    <path d="M 25 25 C 38 38, 42 45, 45 48" stroke="#00e5ff" />
    <path d="M 25 75 C 38 62, 42 55, 45 52" stroke="#00e5ff" />
    <line x1="22" y1="50" x2="42" y2="50" stroke="#00e5ff" stroke-width="3.5" />

    <!-- Right Outflow Streams (Fiery Orange) -->
    <path d="M 75 25 C 62 38, 58 45, 55 48" stroke="#ff5500" />
    <path d="M 75 75 C 62 62, 58 55, 55 52" stroke="#ff5500" />
    <line x1="78" y1="50" x2="58" y2="50" stroke="#ff5500" stroke-width="3.5" />

    <!-- 4 Satellite Conduit Nodes -->
    <circle cx="25" cy="25" r="3.5" fill="#00e5ff" stroke="none" />
    <circle cx="25" cy="75" r="3.5" fill="#00e5ff" stroke="none" />
    <circle cx="75" cy="25" r="3.5" fill="#ff5500" stroke="none" />
    <circle cx="75" cy="75" r="3.5" fill="#ff5500" stroke="none" />

    <!-- Central Nexus Fusion Core -->
    <circle cx="50" cy="50" r="5" fill="#08101e" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="50" cy="50" r="2" fill="#00e5ff" stroke="none" />
  </g>
</svg>