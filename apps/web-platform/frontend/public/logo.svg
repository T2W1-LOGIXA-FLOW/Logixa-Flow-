<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Frame Gradients -->
    <linearGradient id="frameMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="frameHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.6" />
    </linearGradient>

    <!-- Cyan Supply Pipeline Gradients (Left) -->
    <linearGradient id="cyanConduit" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Orange / Flame Pipeline Gradients (Right) -->
    <linearGradient id="orangeConduit" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Metallic Node Gradients -->
    <radialGradient id="nodeMetallic" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Filters for High-Tech Bloom -->
    <filter id="cyanNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orangeNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= X-FRAME (DARK METALLIC CHASSIS) ================= -->
  <g id="metallic-x-structure">
    <!-- Top Left Prongs -->
    <path d="M 120 70 L 190 70 L 250 145 L 250 115 L 180 70 Z" fill="#334155" opacity="0.6" />
    <path d="M 120 70 L 120 140 L 175 195 L 205 165 L 155 115 Z" fill="#1e293b" />

    <!-- Top Right Prongs -->
    <path d="M 380 70 L 310 70 L 250 145 L 250 115 L 320 70 Z" fill="#475569" opacity="0.6" />
    <path d="M 380 70 L 380 140 L 325 195 L 295 165 L 345 115 Z" fill="#1e293b" />

    <!-- Bottom Left Prongs -->
    <path d="M 120 350 L 190 350 L 250 275 L 250 305 L 180 350 Z" fill="#0f172a" />
    <path d="M 120 350 L 120 280 L 175 225 L 205 255 L 155 305 Z" fill="#1e293b" />

    <!-- Bottom Right Prongs -->
    <path d="M 380 350 L 310 350 L 250 275 L 250 305 L 320 350 Z" fill="#1e293b" />
    <path d="M 380 350 L 380 280 L 325 225 L 295 255 L 345 305 Z" fill="#0f172a" />

    <!-- Outer Beveled Chiseled X Border -->
    <path d="M 120 70 L 200 70 Q 250 120 300 70 L 380 70 L 380 150 Q 330 210 380 270 L 380 350 L 300 350 Q 250 300 200 350 L 120 350 L 120 270 Q 170 210 120 150 Z" 
          fill="url(#frameMetallic)" 
          stroke="url(#frameHighlight)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />
  </g>

  <!-- ================= LEFT: CYAN CONDUITS (SUPPLY LOGISTICS) ================= -->
  <g id="cyan-energy-conduits" filter="url(#cyanNeon)">
    <!-- Top-Left Inflow Stream -->
    <path d="M 135 110 Q 185 145 225 185" fill="none" stroke="url(#cyanConduit)" stroke-width="11" stroke-linecap="round" />
    <path d="M 135 110 Q 185 145 225 185" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />

    <!-- Mid-Left Converging Stream -->
    <path d="M 145 160 Q 180 190 205 210" fill="none" stroke="url(#cyanConduit)" stroke-width="8" stroke-linecap="round" />

    <!-- Bottom-Left Inflow Stream -->
    <path d="M 135 310 Q 185 275 225 235" fill="none" stroke="url(#cyanConduit)" stroke-width="11" stroke-linecap="round" />
    <path d="M 135 310 Q 185 275 225 235" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />

    <!-- Mid-Bottom-Left Converging Stream -->
    <path d="M 145 260 Q 180 230 205 210" fill="none" stroke="url(#cyanConduit)" stroke-width="8" stroke-linecap="round" />

    <!-- Outer Cyan Glow Arc -->
    <path d="M 140 145 Q 195 210 140 275" fill="none" stroke="#0ea5e9" stroke-width="5" opacity="0.8" />
  </g>

  <!-- ================= RIGHT: ORANGE CONDUITS (FLOW & VELOCITY) ================= -->
  <g id="orange-energy-conduits" filter="url(#orangeNeon)">
    <!-- Top-Right Outflow Stream -->
    <path d="M 365 110 Q 315 145 275 185" fill="none" stroke="url(#orangeConduit)" stroke-width="11" stroke-linecap="round" />
    <path d="M 365 110 Q 315 145 275 185" fill="none" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" />

    <!-- Mid-Right Stream -->
    <path d="M 355 160 Q 320 190 295 210" fill="none" stroke="url(#orangeConduit)" stroke-width="8" stroke-linecap="round" />

    <!-- Bottom-Right Outflow Stream -->
    <path d="M 365 310 Q 315 275 275 235" fill="none" stroke="url(#orangeConduit)" stroke-width="11" stroke-linecap="round" />
    <path d="M 365 310 Q 315 275 275 235" fill="none" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" />

    <!-- Mid-Bottom-Right Stream -->
    <path d="M 355 260 Q 320 230 295 210" fill="none" stroke="url(#orangeConduit)" stroke-width="8" stroke-linecap="round" />

    <!-- Outer Orange Glow Arc -->
    <path d="M 360 145 Q 305 210 360 275" fill="none" stroke="#f97316" stroke-width="5" opacity="0.8" />
  </g>

  <!-- ================= CENTRAL 4 MATRIX HUBS (NEXUS CORES) ================= -->
  <g id="central-matrix-nodes">
    <!-- Top Hub -->
    <circle cx="250" cy="165" r="19" fill="url(#nodeMetallic)" stroke="#475569" stroke-width="2.5" />
    <circle cx="250" cy="165" r="10" fill="#020617" />
    <circle cx="250" cy="165" r="5" fill="#38bdf8" opacity="0.9" />

    <!-- Bottom Hub -->
    <circle cx="250" cy="255" r="19" fill="url(#nodeMetallic)" stroke="#475569" stroke-width="2.5" />
    <circle cx="250" cy="255" r="10" fill="#020617" />
    <circle cx="250" cy="255" r="5" fill="#f97316" opacity="0.9" />

    <!-- Left Hub (Cyan Entry) -->
    <circle cx="205" cy="210" r="19" fill="url(#nodeMetallic)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="205" cy="210" r="10" fill="#020617" />
    <circle cx="205" cy="210" r="5" fill="#67e8f9" />

    <!-- Right Hub (Orange Exit) -->
    <circle cx="295" cy="210" r="19" fill="url(#nodeMetallic)" stroke="#f97316" stroke-width="2" />
    <circle cx="295" cy="210" r="10" fill="#020617" />
    <circle cx="295" cy="210" r="5" fill="#fdba74" />
  </g>

  <!-- ================= TYPOGRAPHY (LOGIXA FLOW) ================= -->
  <g id="brand-typography">
    <!-- "LOGIXA" in Deep Dark Cyber Metallic -->
    <text x="50" y="420" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="46" font-weight="900" letter-spacing="7" fill="#0f172a">
      LOGIXA
    </text>

    <!-- "FLOW" in Fiery Gradient Orange -->
    <text x="320" y="420" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="46" font-weight="900" letter-spacing="7" fill="url(#orangeConduit)">
      FLOW
    </text>

    <!-- Accent Underline Divider -->
    <line x1="52" y1="440" x2="90" y2="440" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="410" y1="440" x2="448" y2="440" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

    <!-- Subtitle: SMARTER SUPPLY CHAIN. LIMITLESS FLOW. -->
    <text x="250" y="444" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="3.5" fill="#475569" text-anchor="middle">
      SMARTER SUPPLY CHAIN. LIMITLESS FLOW.
    </text>
  </g>
</svg>
