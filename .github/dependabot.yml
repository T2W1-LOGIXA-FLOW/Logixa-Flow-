version: 2
updates:
  - package-ecosystem: npm
    directory: /web-platform/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /web-platform/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
