version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-platform/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      frontend-safe-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /apps/web-platform/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      backend-safe-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
