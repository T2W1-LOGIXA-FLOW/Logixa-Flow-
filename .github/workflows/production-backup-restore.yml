name: Production Backup Restore Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
    steps:
      - name: Validate connection mode and isolated restore target
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_DB_URL SUPABASE_RESTORE_DB_URL; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing or empty production environment secrets: %s\n' "${missing[*]}"
            echo "Configure them under GitHub Settings > Environments > production > Environment secrets."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          production_ref = "ephrnmigiwjhdjksreos"
          restore_ref = "bxvykaijlrqjvlhtumpg"
          parsed = {}
          normalized = {}
          for name in ("SUPABASE_DB_URL", "SUPABASE_RESTORE_DB_URL"):
              value = os.environ[name]
              p = urlparse(value)
              if p.scheme not in ("postgres", "postgresql") or not p.hostname or not p.username or not p.path.strip("/"):
                  raise SystemExit(f"::error::{name} is not a valid PostgreSQL connection URL")
              if not p.hostname.endswith(".pooler.supabase.com") or p.port != 5432:
                  raise SystemExit(f"::error::{name} must use the Supabase shared Session Pooler (pooler.supabase.com:5432), not the direct IPv6 endpoint or transaction pooler")
              params = parse_qsl(p.query, keep_blank_values=True)
              ssl_modes = [v.lower() for k, v in params if k.lower() == "sslmode"]
              if ssl_modes and any(mode not in ("require", "verify-ca", "verify-full") for mode in ssl_modes):
                  raise SystemExit(f"::error::{name} has an insecure sslmode; use require, verify-ca, or verify-full")
              if not ssl_modes:
                  params.append(("sslmode", "require"))
              normalized[name] = urlunparse(p._replace(query=urlencode(params)))
              parsed[name] = p
          source_user = parsed["SUPABASE_DB_URL"].username
          restore_user = parsed["SUPABASE_RESTORE_DB_URL"].username
          if production_ref not in source_user:
              raise SystemExit("::error::SUPABASE_DB_URL username does not identify the expected production project")
          if restore_ref not in restore_user:
              raise SystemExit("::error::SUPABASE_RESTORE_DB_URL must target the dedicated isolated restore project bxvykaijlrqjvlhtumpg")
          if source_user == restore_user or production_ref in restore_user or restore_ref in source_user:
              raise SystemExit("::error::Production and isolated restore database identities are not distinct")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in normalized.items():
                  env_file.write(f"{name}={value}\n")
          print("Connection mode, TLS, production identity, and isolated restore target checks passed; TLS is enforced in the job environment.")
          PY
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Preflight database connectivity
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command 'select current_database(), current_user'
          psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command 'select current_database(), current_user'
      - name: Create production logical backup
        run: |
          # Supabase-managed roles/settings are platform-owned; replaying role-only dumps
          # can fail on restricted ALTER ROLE settings (for example log_min_messages).
          # Restore application schema/data into the isolated project using its existing roles.
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logixa-backup"
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/schema.sql"
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          test -s "$RUNNER_TEMP/logixa-backup/schema.sql"
          test -s "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Reset isolated restore schema
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::This intentionally replaces the public schema in the validated isolated restore project bxvykaijlrqjvlhtumpg. Never change the target guard to production."
          psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public AUTHORIZATION postgres; GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role; GRANT ALL ON SCHEMA public TO postgres, service_role;'
      - name: Restore into isolated target
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/logixa-backup/schema.sql"
          psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --single-transaction --command 'SET session_replication_role = replica' --file "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Verify restored critical state
        shell: bash
        run: |
          set -euo pipefail
          expected_head="20261008_0012"
          restored_head="$(psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atc "select version_num from public.alembic_version order by version_num desc limit 1")"
          if [[ "$restored_head" != "$expected_head" ]]; then
            echo "::error::Restored Alembic head mismatch: expected $expected_head, got ${restored_head:-<empty>}"
            exit 1
          fi
          restored_tables="$(psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atc "select concat_ws(',', to_regclass('public.workflows'), to_regclass('public.workflow_runs'), to_regclass('public.scheduled_workflow_jobs'), to_regclass('public.rag_observability_events'))")"
          if [[ "$restored_tables" != "workflows,workflow_runs,scheduled_workflow_jobs,rag_observability_events" ]]; then
            echo "::error::One or more critical tables are missing after restore: ${restored_tables:-<empty>}"
            exit 1
          fi
          rag_event_count="$(psql "$SUPABASE_RESTORE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atc "select count(*) from public.rag_observability_events")"
          if [[ ! "$rag_event_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Restored RAG observability row count is not numeric"
            exit 1
          fi
          printf 'Restore assertions passed: alembic_head=%s; critical_tables=4/4; rag_observability_events=%s rows.\n' "$restored_head" "$rag_event_count"
      - name: Remove backup material
        if: always()
        run: rm -rf "$RUNNER_TEMP/logixa-backup"
