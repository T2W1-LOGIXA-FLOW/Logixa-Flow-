name: Production Backup Restore Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
    steps:
      - name: Validate isolated target
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_RESTORE_DB_URL"
          test "$SUPABASE_DB_URL" != "$SUPABASE_RESTORE_DB_URL"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create production logical backup
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logixa-backup"
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/roles.sql" --role-only
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/schema.sql"
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          test -s "$RUNNER_TEMP/logixa-backup/roles.sql"
          test -s "$RUNNER_TEMP/logixa-backup/schema.sql"
          test -s "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Restore into isolated target
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" --single-transaction --variable ON_ERROR_STOP=1             --file "$RUNNER_TEMP/logixa-backup/roles.sql"             --file "$RUNNER_TEMP/logixa-backup/schema.sql"             --command 'SET session_replication_role = replica'             --file "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Verify restored critical state
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select version_num from alembic_version order by version_num desc limit 1"
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regclass('public.workflows'), to_regclass('public.workflow_runs'), to_regclass('public.scheduled_workflow_jobs'), to_regclass('public.rag_observability_events')"
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from public.rag_observability_events"
      - name: Remove backup material
        if: always()
        run: rm -rf "$RUNNER_TEMP/logixa-backup"
