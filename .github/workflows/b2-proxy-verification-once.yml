name: One-time B2 Proxy Production Verification
# Re-run after the probe-result log format is live.

on:
  push:
    branches:
      - b2-proxy-verification-once

permissions:
  contents: read

jobs:
  verify-b2-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      RUN_LIVE_E2E: "1"
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_ADMIN_EMAIL: ${{ secrets.PRODUCTION_ADMIN_EMAIL }}
      PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
    defaults:
      run:
        working-directory: web-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in PRODUCTION_API_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY PRODUCTION_ADMIN_EMAIL PRODUCTION_ADMIN_PASSWORD S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET; do
            test -n "${!key:-}" || { echo "::error::Missing production secret: $key"; exit 1; }
          done
      - name: Log safe direct-provider endpoint details
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          host = (urlsplit(os.environ["S3_ENDPOINT_URL"]).hostname or "unknown").lower()
          match = re.fullmatch(r"s3\.([a-z0-9-]+)\.backblazeb2\.com", host)
          print(f"GitHub direct-test endpoint_host={host}")
          print(f"GitHub direct-test endpoint_region={match.group(1) if match else 'not-derived'}")
          PY
      - name: Sync known-good B2 settings into Render and deploy
        id: render-sync
        shell: bash
        run: |
          set -euo pipefail
          token="${RENDER_API_KEY:-${RENDER_API_TOKEN:-${RENDER_TOKEN:-}}}"
          if [[ -z "$token" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Render API token secret found; Render B2 variables were not changed."
            exit 0
          fi
          for key in S3_ENDPOINT_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request PUT "https://api.render.com/v1/services/srv-d9172fe8bjmc739pd600/env-vars/$key" \
              --header "Authorization: Bearer $token" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg value "${!key}" '{value:$value}')")
            if [[ "$status" != "200" ]]; then
              echo "::error::Render env update failed for $key (HTTP $status)"
              exit 1
            fi
            echo "Updated Render env var: $key"
          done
          deploy_json=$(curl --silent --show-error --fail \
            --request POST "https://api.render.com/v1/services/srv-d9172fe8bjmc739pd600/deploys" \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}')
          deploy_id=$(printf '%s' "$deploy_json" | jq -r '.id // empty')
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render accepted no deployment ID after environment update"
            exit 1
          fi
          echo "Render deploy triggered: $deploy_id"
          live=false
          for attempt in $(seq 1 36); do
            response=$(curl --silent --show-error --fail \
              --request GET "https://api.render.com/v1/services/srv-d9172fe8bjmc739pd600/deploys/$deploy_id" \
              --header "Authorization: Bearer $token")
            status=$(printf '%s' "$response" | jq -r '.status // "unknown"')
            echo "Render deployment status: $status"
            if [[ "$status" == "live" ]]; then
              live=true
              break
            fi
            if [[ "$status" == "build_failed" || "$status" == "update_failed" || "$status" == "canceled" || "$status" == "pre_deploy_failed" ]]; then
              echo "::error::Render deployment ended with status $status"
              exit 1
            fi
            sleep 10
          done
          if [[ "$live" != "true" ]]; then
            echo "::error::Render deployment did not reach live status within 6 minutes"
            exit 1
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Run direct B2 and authenticated application proxy round trips
        if: steps.render-sync.outputs.updated == 'true'
        run: python -m pytest -q tests/test_live_release_gates.py::test_live_b2_s3_round_trip tests/test_live_release_gates.py::test_live_b2_application_download_proxy_round_trip
      - name: Recheck current failure when Render API token is unavailable
        if: steps.render-sync.outputs.updated != 'true'
        run: python -m pytest -q tests/test_live_release_gates.py::test_live_b2_s3_round_trip tests/test_live_release_gates.py::test_live_b2_application_download_proxy_round_trip
