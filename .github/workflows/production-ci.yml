name: Production CI/CD Pipeline (Non-Docker)

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: logixa-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/web-platform/backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/web-platform/backend/requirements.txt
          pip install flake8 pytest httpx

      - name: Syntax & Lint Verification
        run: |
          python -m compileall -q apps/web-platform/backend
          flake8 apps/web-platform/backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Database Migration Script
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          PYTHONPATH: apps/web-platform/backend
        run: |
          python scripts/production_migrate.py

      - name: Execute Backend Tests
        env:
          JWT_SECRET: ci-production-jwt-test-secret-at-least-32-chars
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./ci_test.db
          SKIP_SEEDING: "true"
          ENABLE_SCHEDULER: "false"
          PYTHONPATH: apps/web-platform/backend
        run: |
          python -m pytest apps/web-platform/backend/tests -q --maxfail=5

  frontend-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web-platform/frontend
        run: npm ci

      - name: Build Next.js Production App
        working-directory: apps/web-platform/frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://logixa-flow.onrender.com
        run: npm run build

  production-gate:
    name: Production Release Gate
    needs: [backend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Build Readiness
        run: echo "Automated CI checks passed. Production readiness still requires deployment health, end-to-end workflow, and rollback verification."
