name: Live Release Gates

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider gate to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cloudinary
          - supabase
          - b2
          - google-drive
          - auth
          - backup-restore

permissions:
  contents: read

concurrency:
  group: live-release-gates-${{ github.ref }}-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  live-providers:
    if: inputs.provider != 'auth' && inputs.provider != 'backup-restore'
    runs-on: ubuntu-latest
    environment: production
    env:
      RUN_LIVE_E2E: "1"
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
      GOOGLE_DRIVE_EXPORT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_EXPORT_FOLDER_ID }}
    defaults:
      run:
        working-directory: web-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate selected provider configuration
        shell: bash
        run: |
          set -euo pipefail
          require() { test -n "${!1:-}" || { echo "::error::Missing production secret: $1"; exit 1; }; }
          case "${{ inputs.provider }}" in
            cloudinary) require CLOUDINARY_CLOUD_NAME; require CLOUDINARY_API_KEY; require CLOUDINARY_API_SECRET ;;
            supabase) require SUPABASE_URL; require SUPABASE_SERVICE_ROLE_KEY; require SUPABASE_STORAGE_BUCKET ;;
            b2) require S3_ENDPOINT_URL; require S3_ACCESS_KEY_ID; require S3_SECRET_ACCESS_KEY; require S3_BUCKET ;;
            google-drive) require GOOGLE_DRIVE_CREDENTIALS_JSON ;;
            all) require CLOUDINARY_CLOUD_NAME; require CLOUDINARY_API_KEY; require CLOUDINARY_API_SECRET; require SUPABASE_URL; require SUPABASE_SERVICE_ROLE_KEY; require SUPABASE_STORAGE_BUCKET; require S3_ENDPOINT_URL; require S3_ACCESS_KEY_ID; require S3_SECRET_ACCESS_KEY; require S3_BUCKET; require GOOGLE_DRIVE_CREDENTIALS_JSON ;;
          esac
      - name: Run selected live release gate
        env:
          PYTEST_ADDOPTS: >-
            ${{ inputs.provider == 'cloudinary' && 'test_live_release_gates.py::test_live_cloudinary_upload_round_trip' || inputs.provider == 'supabase' && 'test_live_release_gates.py::test_live_supabase_storage_upload_round_trip' || inputs.provider == 'b2' && 'test_live_release_gates.py::test_live_b2_s3_round_trip' || inputs.provider == 'google-drive' && 'test_live_release_gates.py::test_live_google_drive_upload_round_trip' || 'test_live_release_gates.py' }}
        run: python -m pytest -q tests/$PYTEST_ADDOPTS
  production-auth:
    if: inputs.provider == 'auth'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TEST_EMAIL: ${{ secrets.PRODUCTION_TEST_ADMIN_EMAIL }}
      TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_ADMIN_PASSWORD }}
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production auth configuration
        shell: bash
        run: |
          set -euo pipefail
          require() { test -n "${!1:-}" || { echo "::error::Missing production secret: $1"; exit 1; }; }
          require SUPABASE_URL
          require SUPABASE_PUBLISHABLE_KEY
          require TEST_EMAIL
          require TEST_PASSWORD
          require PRODUCTION_API_URL
      - name: Authenticate against production Supabase Auth
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Content-Type: application/json" --data "$(python - <<'PY'
import json, os
print(json.dumps({"email": os.environ["TEST_EMAIL"], "password": os.environ["TEST_PASSWORD"]}))
PY
)")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<<"$response")"
          test -n "$token"
          printf '%s' "$token" > "$RUNNER_TEMP/access_token"
      - name: Verify authenticated admin API
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/access_token")"
          me="$(curl -fsS -H "Authorization: Bearer $token" "${PRODUCTION_API_URL%/}/api/auth/me")"
          python - "$me" <<'PY'
import json, sys
payload = json.loads(sys.argv[1])
assert payload.get("role") == "admin", payload
assert payload.get("username"), payload
PY
      - name: Verify protected RAG admin endpoint
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/access_token")"
          curl -fsS -H "Authorization: Bearer $token" "${PRODUCTION_API_URL%/}/api/admin/rag/metrics?hours=1" >/dev/null
      - name: Remove temporary token
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/access_token"

  backup-restore:
    if: inputs.provider == 'backup-restore'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated restore configuration
        shell: bash
        run: |
          set -euo pipefail
          require() { test -n "${!1:-}" || { echo "::error::Missing production secret: $1"; exit 1; }; }
          require SUPABASE_DB_URL
          require SUPABASE_RESTORE_DB_URL
          if [ "$SUPABASE_DB_URL" = "$SUPABASE_RESTORE_DB_URL" ]; then
            echo "::error::Restore target must be different from production."
            exit 1
          fi
      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global supabase
          supabase --version
      - name: Create logical production backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logixa-backup"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/logixa-backup/data.sql" --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          test -s "$RUNNER_TEMP/logixa-backup/roles.sql"
          test -s "$RUNNER_TEMP/logixa-backup/schema.sql"
          test -s "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Restore into isolated target
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" --single-transaction --variable ON_ERROR_STOP=1 --file "$RUNNER_TEMP/logixa-backup/roles.sql" --file "$RUNNER_TEMP/logixa-backup/schema.sql" --command 'SET session_replication_role = replica' --file "$RUNNER_TEMP/logixa-backup/data.sql"
      - name: Verify restored Logixa Flow data
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select version_num from alembic_version order by version_num desc limit 1"
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regclass('public.workflows'), to_regclass('public.workflow_runs'), to_regclass('public.workflow_jobs'), to_regclass('public.rag_observability_events')"
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from public.rag_observability_events"
      - name: Remove backup material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/logixa-backup"
