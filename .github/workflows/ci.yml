name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      JWT_SECRET: ci-test-secret
      ENVIRONMENT: test
      SKIP_DATABASE_BOOTSTRAP: "true"
      SKIP_SEEDING: "true"
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r web-platform/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - working-directory: web-platform/frontend
        run: npm ci
      - working-directory: web-platform/frontend
        run: npm audit --omit=dev --audit-level=high
      - working-directory: web-platform/frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
