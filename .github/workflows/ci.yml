name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      JWT_SECRET: ci-test-secret
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci.db
      SKIP_SEEDING: "true"
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q test_agent_service_auth.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r web-platform/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - working-directory: web-platform/frontend
        run: npm ci
      - name: Audit npm dependencies (actionable advisories)
        working-directory: web-platform/frontend
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const report = require("./npm-audit.json");
          const ignored = new Set([
            "braces",
            "postcss",
            "postcss-selector-parser",
            // Build/dev-only dependency chains; not shipped as runtime application code.
            "@next/eslint-plugin-next",
            "eslint-config-next",
            "chokidar",
            "fast-glob",
            "globby",
            "micromatch",
            "next-pwa",
            "tailwindcss",
          ]);
          const actionable = Object.entries(report.vulnerabilities || {})
            .filter(([name, advisory]) => !ignored.has(name) && ["high", "critical"].includes(advisory.severity));
          if (actionable.length) {
            console.error(JSON.stringify(Object.fromEntries(actionable), null, 2));
            process.exit(1);
          }
          console.log("No actionable high/critical runtime npm advisories; known build/dev-only dependency findings are explicitly tracked separately.");
          NODE
