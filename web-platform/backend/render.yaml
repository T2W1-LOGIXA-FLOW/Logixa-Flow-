services:
  - type: web
    name: logixa-flow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logixa-flow-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: API_SECRET_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: REQUIRE_AI_KEY
        value: false
      - key: AI_COST_PER_1K
        value: "0"
      - key: USER_AI_PROVIDER
        value: openrouter
      - key: USER_AI_MODEL
        value: openrouter/free
      - key: USER_GEMINI_API_KEY
        sync: false
      - key: ADMIN_AI_PROVIDER
        value: openrouter
      - key: ADMIN_AI_MODEL
        value: openrouter/free
      - key: ADMIN_MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_LLAMA_MODEL
        value: openrouter/free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-r-plus
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: REDIS_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: true
      - key: SCHEDULER_INTERVAL_HOURS
        value: "24"

databases:
  - name: logixa-flow-db
    databaseName: logixa_flow
    user: logixa_user
    plan: free
