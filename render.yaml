services:
  - type: web
    name: logixa-flow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./web-platform/backend/Dockerfile
    dockerContext: ./web-platform/backend
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PROFILE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: API_SECRET_TOKEN
        generateValue: true
      - key: REQUIRE_AI_KEY
        value: false
      - key: USER_AI_PROVIDER
        value: gemini
      - key: USER_AI_MODEL
        value: gemini-2.5-flash
      - key: USER_GEMINI_API_KEY
        sync: false
      - key: ADMIN_AI_PROVIDER
        value: mistral
      - key: ADMIN_AI_MODEL
        value: mistral-small-latest
      - key: ADMIN_MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_LLAMA_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-r-plus
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: true
      - key: SCHEDULER_INTERVAL_HOURS
        value: "24"
      - key: UPLOAD_STORAGE_BACKEND
        value: b2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-west-004
      - key: S3_PUBLIC_BASE_URL
        sync: false
  - type: worker
    name: logixa-flow-worker
    runtime: docker
    plan: free
    dockerfilePath: ./agents/Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: PIPELINE_BATCH_LIMIT
        value: 3
      - key: AUTO_APPROVE_PUBLISH
        value: false
      - key: WORKER_MODE
        value: web-pipeline
      - key: WORKER_INTERVAL_SECONDS
        value: 3600
      - key: WORKER_RUN_ON_START
        value: true
      - key: WORKER_ONCE
        value: false
