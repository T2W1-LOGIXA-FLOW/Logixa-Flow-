services:
  - type: web
    name: logixa-flow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./web-platform/backend/Dockerfile
    dockerContext: ./web-platform/backend
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PROFILE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_SECRET_TOKEN
        generateValue: true
      - key: AGENT_SERVICE_TOKEN
        sync: false
      - key: REQUIRE_AI_KEY
        value: false
      - key: AI_COST_PER_1K
        value: "0"
      - key: EMBEDDING_MODEL
        value: liquid/lfm-2.5-embedding-350m:free
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: EMBEDDING_COST_PER_1K
        value: "0"
      - key: USER_AI_ENABLED
        value: false
      - key: ADMIN_AI_ENABLED
        value: true
      - key: USER_AI_PROVIDER
        value: openrouter
      - key: USER_AI_MODEL
        value: openrouter/free
      - key: USER_GEMINI_API_KEY
        sync: false
      - key: USER_OPENROUTER_API_KEY
        sync: false
      - key: USER_GROQ_API_KEY
        sync: false
      - key: USER_CEREBRAS_API_KEY
        sync: false
      - key: USER_MISTRAL_API_KEY
        sync: false
      - key: USER_COHERE_API_KEY
        sync: false
      - key: USER_NVIDIA_NIM_API_KEY
        sync: false
      - key: ADMIN_AI_PROVIDER
        value: openrouter
      - key: ADMIN_AI_MODEL
        value: openrouter/free
      - key: ADMIN_GEMINI_API_KEY
        sync: false
      - key: ADMIN_OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_GROQ_API_KEY
        sync: false
      - key: ADMIN_CEREBRAS_API_KEY
        sync: false
      - key: ADMIN_MISTRAL_API_KEY
        sync: false
      - key: ADMIN_COHERE_API_KEY
        sync: false
      - key: ADMIN_NVIDIA_NIM_API_KEY
        sync: false
      # Optional task-specific provider overrides. If unset, the role-level
      # provider remains the default and the normal fallback chain applies.
      - key: AI_TASK_PROVIDER_RESEARCH
        value: ""
      - key: AI_TASK_MODEL_RESEARCH
        value: ""
      - key: AI_TASK_PROVIDER_ANALYSIS
        value: ""
      - key: AI_TASK_MODEL_ANALYSIS
        value: ""
      - key: AI_TASK_PROVIDER_WRITING
        value: ""
      - key: AI_TASK_MODEL_WRITING
        value: ""
      - key: AI_TASK_PROVIDER_SEO
        value: ""
      - key: AI_TASK_MODEL_SEO
        value: ""
      - key: AI_TASK_PROVIDER_FACTCHECK
        value: ""
      - key: AI_TASK_MODEL_FACTCHECK
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_LLAMA_MODEL
        value: openrouter/free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-r-plus
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: true
      - key: SCHEDULER_INTERVAL_HOURS
        value: "24"
      - key: CELERY_ENABLED
        value: false
      - key: CELERY_QUEUE
        value: logixa-workflows
      - key: WORKFLOW_CLAIM_LEASE_SECONDS
        value: "3600"
      - key: QSTASH_URL
        value: https://qstash.upstash.io
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: QSTASH_DESTINATION_URL
        sync: false
      - key: QSTASH_TIMEOUT
        value: 10s
      - key: QSTASH_RETRIES
        value: "3"
      - key: UPLOAD_STORAGE_BACKEND
        value: cloudinary
      - key: STORAGE_FALLBACK_BACKENDS
        value: supabase,b2
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: SUPABASE_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-west-004
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_DRIVE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_DRIVE_EXPORT_FOLDER_ID
        sync: false
