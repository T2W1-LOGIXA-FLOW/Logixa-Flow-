services:
  - type: web
    name: logixa-flow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./web-platform/backend/Dockerfile
    dockerContext: ./web-platform/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logixa-flow-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: API_SECRET_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: REQUIRE_AI_KEY
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: logixa-flow-db
    databaseName: logixa_flow
    user: logixa_user
    plan: free
